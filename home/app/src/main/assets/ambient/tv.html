<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--AMBIENT_BASE-->
<title>Ambient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* Laid out on a 1920 x 1080 board, the size of the design, and scaled to the screen. One grid: 48px from the
     screen's edges and 40px between widgets. Columns: clock and turntable 48-661, weather 701-1155, Jarvis and
     notes 1462-1872. Rows: 38-541 / 581-1043 on the left; 38-547 / 587-705 / 745-865 / 905-1043 in the middle. */
  :root {
    --fg: #f4f4f6;
    --dim: rgba(244, 244, 246, .62);
    --faint: rgba(244, 244, 246, .34);
    --accent: #ff4d6d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0b0c; color: var(--fg);
    font-family: 'Outfit', system-ui, sans-serif; font-weight: 400;
    -webkit-font-smoothing: antialiased; cursor: none;
  }
  #board { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; background: #111 url(bg.jpg) center / cover no-repeat; }
  /* The song's colours, very soft, over the waves. */
  #glow { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; opacity: 0; transition: opacity 1.6s ease; mix-blend-mode: screen; }
  #glow.on { opacity: .35; }
  #drift { position: absolute; inset: 0; transition: transform 2s ease; }

  /* ---------- Liquid glass: a tinted pane, a bright rim on the top-left and a dark one bottom-right. */
  .glass {
    position: absolute; overflow: hidden;
    background: linear-gradient(150deg, rgba(150,150,155,.50), rgba(90,90,96,.38) 55%, rgba(70,70,76,.42));
    box-shadow: -15px -10px 22px rgba(0,0,0,.25), 0 24px 60px rgba(0,0,0,.35),
      inset 2px 2px 1px rgba(255,255,255,.35), inset -2px -2px 2px rgba(0,0,0,.25), inset 0 0 0 1.5px rgba(255,255,255,.12);
  }
  .glass::before {   /* a broad soft sheen across the upper half */
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 70% at 30% 0%, rgba(255,255,255,.20), rgba(255,255,255,0) 60%);
  }
  .drops { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- Clock */
  #clockCard { left: 48px; top: 38px; width: 582px; height: 503px; border-radius: 100px;
    background: linear-gradient(150deg, rgba(120,120,124,.45), rgba(102,102,102,.37)); }
  #date { position: absolute; left: 46px; right: 40px; top: 250px; text-align: center; font-size: 19px; letter-spacing: .1em; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; color: var(--dim); font-weight: 500; white-space: nowrap; }
  #clock { position: absolute; left: 44px; bottom: 287px; font-family: 'Anton', 'Impact', sans-serif; font-size: 184px; line-height: .84;
    letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 4px 18px rgba(0,0,0,.25); }
  #clock .ap { font-size: .53em; margin-left: .04em; }
  #clockBar { position: absolute; left: 44px; top: 228px; width: 495px; height: 12px; border-radius: 6px; background: #fff; }

  /* Sunrise and sunset: a sky-coloured strip; the dial shows how much of the day (or night) is left. */
  #sunPill { position: absolute; left: 49px; top: 288px; width: 485px; height: 186px; border-radius: 60px; overflow: hidden;
    background: linear-gradient(180deg, #6fc6e6 0%, #9fd0dc 45%, #f2b47c 100%); opacity: .82;
    box-shadow: inset 0 2px 1px rgba(255,255,255,.5), inset 0 -2px 2px rgba(0,0,0,.12); transition: background 2s ease; }
  #sunPill.night { background: linear-gradient(180deg, #27305e 0%, #45448a 55%, #8d5d9c 100%); }
  #sunPill .ico { position: absolute; top: 18px; width: 54px; height: 44px; }
  #sunPill .ico.l { left: 34px; } #sunPill .ico.r { right: 34px; }
  #sunPill .tm { position: absolute; bottom: 16px; font-size: 40px; font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px rgba(0,0,0,.18); }
  #sunPill .tm.l { left: 32px; } #sunPill .tm.r { right: 32px; }
  #dial { position: absolute; left: 50%; top: 50%; width: 164px; height: 164px; margin: -82px 0 0 -82px; }
  #dialTxt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; white-space: nowrap; }
  #dialTxt b { display: block; font-size: 24px; font-weight: 600; line-height: 1; }
  #dialTxt span { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-top: 4px; }

  /* ---------- Weather, on the liquid-glass card from the design. */
  #wxCard { left: 701px; top: 38px; width: 454px; height: 509px; border-radius: 100px; opacity: 0; transition: opacity 1.2s ease;
    background: url(glass_grey.webp) center / 100% 100% no-repeat; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
  #wxCard::before { display: none; }
  #wxCard.on { opacity: .92; }
  #wxTint { position: absolute; inset: 0; background: linear-gradient(170deg, rgba(110,160,210,.18), rgba(60,80,110,.10)); }
  #wCity { position: absolute; left: 0; right: 0; top: 30px; text-align: center; font-size: 34px; font-weight: 400; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 70px; text-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #wIcon { position: absolute; left: 50%; top: 78px; width: 210px; height: 150px; margin-left: -105px; }
  #wTemp { position: absolute; left: 0; right: 0; top: 222px; text-align: center; font-size: 112px; font-weight: 300; line-height: 1; color: #fff;
    letter-spacing: -.02em; text-shadow: 0 2px 10px rgba(0,0,0,.18); }
  #wDesc { position: absolute; left: 0; right: 0; top: 340px; text-align: center; font-size: 30px; color: #fff; }
  #wSub { position: absolute; left: 0; right: 0; top: 382px; text-align: center; font-size: 19px; color: rgba(255,255,255,.75); }
  #wRow { position: absolute; left: 40px; right: 40px; bottom: 34px; display: flex; justify-content: center; align-items: center; gap: 18px;
    font-size: 23px; color: #fff; white-space: nowrap; }
  #wRow .sep { width: 1.5px; height: 22px; background: rgba(255,255,255,.4); }
  #wRow svg { width: 20px; height: 20px; vertical-align: -3px; margin-right: 5px; }

  /* Next hours, a thin glass strip under the weather. */
  #wHours { left: 701px; top: 587px; width: 454px; height: 118px; border-radius: 40px; display: flex; justify-content: space-around; align-items: center;
    padding: 0 16px; opacity: 0; transition: opacity 1.2s ease; }
  #wHours.on { opacity: 1; }
  .hr { text-align: center; font-size: 16px; color: var(--dim); width: 64px; }
  .hr svg { display: block; width: 46px; height: 34px; margin: 4px auto 2px; }
  .hr span { color: #fff; font-weight: 500; font-size: 20px; }
  .hr em { display: block; font-style: normal; font-size: 13px; color: #9fd6ff; min-height: 1em; }

  /* Air, wind and rain: a glass tile under the hours, three columns. */
  #wTile { left: 701px; top: 745px; width: 454px; height: 120px; border-radius: 40px; display: flex; align-items: center;
    opacity: 0; transition: opacity 1.2s ease; }
  #wTile.on { opacity: 1; }
  #wTile .col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #wTile .col + .col::before { content: ''; position: absolute; left: 0; top: 24px; bottom: 24px; width: 1.5px; background: rgba(255,255,255,.22); }
  #wTile .k { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  #wTile b { font-size: 32px; font-weight: 500; line-height: 1.1; margin-top: 2px; white-space: nowrap; }
  #wTile b small { font-size: 16px; font-weight: 400; color: var(--dim); margin-left: 3px; }
  #wTile .s { font-size: 15px; color: var(--dim); margin-top: 3px; white-space: nowrap; }
  #aqiCol { --aqi: #8a8a95; }
  #aqiCol b { color: var(--aqi); text-shadow: 0 0 14px color-mix(in srgb, var(--aqi) 40%, transparent); }
  #aqiScale { width: 96px; height: 5px; border-radius: 3px; position: relative; margin-top: 5px;
    background: linear-gradient(90deg, #50f0e6, #50ccaa, #f0e641, #ff8a50, #ff5050, #960032); }
  #aqiScale i { position: absolute; top: 50%; left: 0; width: 11px; height: 11px; border-radius: 50%; background: #fff;
    transform: translate(-50%, -50%); box-shadow: 0 0 0 2.5px rgba(0,0,0,.45); transition: left 1s ease; }
  #windArrow { display: inline-block; width: 24px; height: 24px; vertical-align: -2px; margin-right: 6px; transition: transform 1s ease; }

  /* ---------- Jarvis */
  #blobBox { position: absolute; left: 1591px; top: 38px; width: 281px; height: 281px; }
  #blobHalo { position: absolute; inset: -30%; border-radius: 50%; opacity: 0; transition: opacity .8s ease;
    background: radial-gradient(circle, rgba(220,230,255,.28), rgba(160,180,255,.08) 45%, transparent 68%); }
  body.jarvis-speaking #blobHalo, body.jarvis-listening #blobHalo { opacity: 1; }
  #blob { position: absolute; inset: 0; width: 100%; height: 100%; }
  .blobImg { position: absolute; inset: 0; width: 100%; height: 100%; animation: wob 7s ease-in-out infinite; }
  .blobImg[data-mode=speaking] { animation: wob 1.1s ease-in-out infinite; }
  @keyframes wob { 0%,100% { transform: scale(1) rotate(0); border-radius: 50%; } 33% { transform: scale(1.03, .97) rotate(6deg); } 66% { transform: scale(.97, 1.03) rotate(-5deg); } }
  #rings { position: absolute; inset: 10%; pointer-events: none; }
  #rings i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.5); opacity: 0; }
  body.jarvis-listening #rings i { animation: ripple 1.8s ease-out infinite; }
  #rings i:nth-child(2) { animation-delay: .6s !important; } #rings i:nth-child(3) { animation-delay: 1.2s !important; }
  @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }

  /* What Jarvis heard and says, to the blob's left. */
  #botBubble { position: absolute; right: 369px; top: 178px; max-width: 387px; min-width: 200px; padding: 22px 28px; border-radius: 34px;
    opacity: 0; transform: translateY(-50%) scale(.92); transform-origin: 100% 50%; z-index: 8;
    transition: opacity .35s ease, transform .4s cubic-bezier(.2,.8,.2,1); }
  #botBubble.on { opacity: 1; transform: translateY(-50%) scale(1); }
  #bbHeard { font-size: 19px; color: var(--dim); font-style: italic; }
  #bbHeard:empty { display: none; }
  #bbReply { font-size: 25px; font-weight: 500; line-height: 1.35; margin-top: 6px; }
  #bbHeard:empty + #bbReply { margin-top: 0; }
  #bbReply .w { opacity: 0; transition: opacity .18s ease; }
  #bbReply .w.on { opacity: 1; }
  .dots i { display: inline-block; width: 9px; height: 9px; margin: 0 2px; border-radius: 50%; background: var(--fg); animation: dot 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%,100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }

  /* ---------- Notes: under Jarvis, newest first. */
  #notes { position: absolute; left: 1462px; top: 359px; width: 410px; max-height: 390px; display: flex; flex-direction: column; gap: 16px; }
  .note { position: relative; padding: 20px 26px 18px 34px; border-radius: 30px; font-size: 24px; line-height: 1.35; color: var(--fg);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .note::after { content: ''; position: absolute; left: 14px; top: 22px; bottom: 22px; width: 5px; border-radius: 3px; background: var(--c, #ffd76a); }
  .note small { display: block; font-size: 16px; color: var(--faint); margin-top: 6px; letter-spacing: .04em; }
  .note .due { color: #9fd6ff; font-weight: 500; }
  .note.new { animation: notePop .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes notePop { from { opacity: 0; transform: translateY(-18px) scale(.96); } to { opacity: 1; transform: none; } }
  .note.ring { animation: ring 1.2s ease-in-out 3; }
  @keyframes ring { 0%,100% { outline: 0 solid rgba(255,122,154,0); } 50% { outline: 5px solid rgba(255,122,154,.6); } }
  #notes .more { font-size: 17px; color: var(--faint); padding-left: 34px; }

  /* ---------- Music: the turntable from the design; the song's cover art turns on the record's label. */
  #deck { left: 48px; top: 581px; width: 613px; height: 462px; border-radius: 70px; background: none; opacity: .92; }
  #deck::before { display: none; }
  /* Three layers on the 613 x 462 deck: the bare deck, the record (centre 237,235, radius 172) and the tonearm,
     which turns on its plate (pivot 485,118). The record's light stays still while the record turns. */
  #deckImg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #discWrap { position: absolute; left: 65px; top: 63px; width: 344px; height: 344px; border-radius: 50%; }
  #disc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; will-change: transform; }
  #sheen { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 25deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.16) 22deg, rgba(255,255,255,0) 55deg,
      rgba(255,255,255,0) 180deg, rgba(255,255,255,.11) 205deg, rgba(255,255,255,0) 238deg, rgba(255,255,255,0) 360deg);
    -webkit-mask: radial-gradient(circle, transparent 0 37%, #000 38%); mask: radial-gradient(circle, transparent 0 37%, #000 38%); }
  #spindle { position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #9a9a9a 60%, #555); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
  #arm { position: absolute; left: 311px; top: 31px; width: 240px; height: 358px; transform-origin: 174px 87px;
    transform: rotate(-18deg); transition: transform 1.2s cubic-bezier(.45,.05,.25,1), filter .35s ease;
    filter: drop-shadow(5px 7px 4px rgba(0,0,0,.35)); }
  /* Lifted: the shadow falls further away, as if the arm rose a few millimetres. */
  #arm.lift { filter: drop-shadow(12px 16px 9px rgba(0,0,0,.28)); }
  html.native #disc, html.native #sheen, html.native #spindle, html.native #arm { display: none; }
  #ytHolder { position: fixed; left: -400px; top: 0; width: 220px; height: 220px; overflow: hidden; }
  #ytHolder iframe, #yt { width: 100%; height: 100%; border: 0; }

  #meta { position: absolute; left: 701px; top: 905px; height: 138px; overflow: hidden; width: 721px; opacity: 0; transform: translateY(20px); transition: opacity .9s ease, transform .9s ease; }
  #meta.on { opacity: 1; transform: none; }
  #npLabel { font-size: 16px; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 12px; }
  #eq { display: inline-flex; gap: 3px; align-items: flex-end; height: 17px; }
  #eq i { width: 4px; height: 100%; background: var(--accent); border-radius: 1px; transform-origin: 50% 100%; animation: eq 1s ease-in-out infinite; }
  #eq i:nth-child(2) { animation-delay: -.3s; } #eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  body.paused #eq i { animation-play-state: paused; }
  #title { font-size: 36px; font-weight: 600; line-height: 1.15; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    text-shadow: 0 2px 12px rgba(0,0,0,.4); }
  #artist { font-size: 22px; color: var(--dim); margin-top: 2px; max-width: 560px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { height: 6px; background: rgba(255,255,255,.14); border-radius: 3px; margin-top: 14px; overflow: hidden; width: 721px; }
  #barFill { height: 100%; width: 100%; background: var(--fg); border-radius: 3px; transform-origin: 0 50%; transform: scaleX(0); }
  #times { position: absolute; right: 0; top: 74px; display: flex; gap: 6px; font-size: 18px; color: var(--faint); margin-top: 8px; font-variant-numeric: tabular-nums; }
  #next { position: absolute; right: 0; top: 0; max-width: 380px; font-size: 16px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #next span { color: var(--dim); }

  /* ---------- The phone link: the code on a white tile with scan corners. */
  #qrTile { position: absolute; left: 1618px; top: 789px; width: 254px; height: 254px; border-radius: 30px; background: #fff; padding: 34px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  #qr { width: 100%; height: 100%; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; }
  #qrTile .c { position: absolute; width: 40px; height: 40px; border: 6px solid #111; }
  #qrTile .c1 { left: 14px; top: 14px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  #qrTile .c2 { right: 14px; top: 14px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  #qrTile .c3 { left: 14px; bottom: 14px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  #qrTile .c4 { right: 14px; bottom: 14px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }

  #toast { position: absolute; left: 50%; top: 40px; transform: translate(-50%, -30px); padding: 14px 30px; border-radius: 40px;
    font-size: 22px; opacity: 0; transition: all .5s ease; z-index: 9; background: rgba(30,30,34,.88); border: 1px solid rgba(255,255,255,.12); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body class="paused">
<div id="board">
  <div id="bg"></div>
  <canvas id="glow" width="32" height="18"></canvas>
  <div id="drift">

    <div id="clockCard" class="glass">
      <div id="date"></div>
      <div id="clock">--:--</div>
      <div id="clockBar"></div>
      <div id="sunPill">
        <svg class="ico l" viewBox="0 0 54 44" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M8 34h38M15 27a12 12 0 0 1 24 0M27 6v8M10 13l5 5M44 13l-5 5"/><path id="icoL" d="M23 10l4-4 4 4"/></svg>
        <svg class="ico r" viewBox="0 0 54 44" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M8 34h38M15 27a12 12 0 0 1 24 0M27 6v8M10 13l5 5M44 13l-5 5"/><path d="M23 10l4 4 4-4"/></svg>
        <svg id="dial" viewBox="0 0 176 176">
          <defs><radialGradient id="dialGlass" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></radialGradient></defs>
          <circle cx="88" cy="88" r="70" fill="url(#dialGlass)" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
          <circle cx="88" cy="88" r="58" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="10"/>
          <circle id="dialArc" cx="88" cy="88" r="58" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 88 88)"/>
          <circle id="dialDot" cx="88" cy="30" r="9" fill="#fff"/>
          <path d="M82 13l6-8 6 8z" fill="#fff"/>
        </svg>
        <div id="dialTxt"><b id="untilNext">–</b><span id="untilName">to sunset</span></div>
        <div class="tm l" id="sunrise">–</div>
        <div class="tm r" id="sunset">–</div>
      </div>
    </div>

    <div id="wxCard" class="glass">
      <div id="wxTint"></div>
      <svg class="drops" viewBox="0 0 454 509"><g id="dropsG"></g></svg>
      <div id="wCity">Locating…</div>
      <svg id="wIcon" viewBox="0 0 210 150"></svg>
      <div id="wTemp"></div>
      <div id="wDesc"></div>
      <div id="wSub"></div>
      <div id="wRow"></div>
    </div>
    <div id="wHours" class="glass"></div>
    <div id="wTile" class="glass">
      <div class="col" id="aqiCol"><span class="k">Air</span><b id="aqiNum">–</b><span class="s" id="aqiBand">–</span><div id="aqiScale"><i id="aqiM"></i></div></div>
      <div class="col"><span class="k">Wind</span><b><svg id="windArrow" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l6 18-6-4-6 4z"/></svg><span id="windV">–</span><small id="windU"></small></b><span class="s" id="windG"></span></div>
      <div class="col"><span class="k">Rain</span><b id="rainV">–</b><span class="s" id="rainS"></span></div>
    </div>

    <div id="blobBox">
      <div id="blobHalo"></div>
      <div id="rings"><i></i><i></i><i></i></div>
      <canvas id="blob" width="384" height="384"></canvas>
    </div>
    <div id="botBubble" class="glass"><div id="bbHeard"></div><div id="bbReply"></div></div>

    <div id="notes"></div>

    <div id="deck" class="glass">
      <img id="deckImg" src="deck.webp" alt="">
      <div id="discWrap"><canvas id="disc" width="688" height="688"></canvas><div id="sheen"></div><div id="spindle"></div></div>
      <img id="arm" src="arm.webp" alt="">
      <div id="ytHolder"><div id="yt"></div></div>
    </div>
    <div id="meta">
      <div id="npLabel"><span id="eq"><i></i><i></i><i></i></span> Now playing</div>
      <div id="next"></div>
      <div id="title"></div>
      <div id="artist"></div>
      <div id="bar"><div id="barFill"></div></div>
      <div id="times"><span id="tPos">0:00</span>/<span id="tDur">0:00</span></div>
    </div>

    <div id="qrTile"><i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i><div id="qr"></div></div>
  </div>
  <div id="toast"></div>
</div>

<script>/*AMBIENT_CONFIG*/</script>
<script src="blob.js"></script>
<script>
(function () {
  'use strict';
  var cfg = window.AMBIENT_CONFIG || { api: '', ip: location.hostname };
  var API = cfg.api;
  var phoneUrl = 'http://' + (cfg.ip || '127.0.0.1') + ':8765/';
  var $ = function (id) { return document.getElementById(id); };

  // ---------- The board: 1920 x 1080, scaled to fill the screen.
  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    $('board').style.transform = 'translate(' + ((window.innerWidth - 1920 * k) / 2) + 'px,' + ((window.innerHeight - 1080 * k) / 2) + 'px) scale(' + k + ')';
  }
  fit(); window.addEventListener('resize', function () { fit(); placeDeck(); placeBlob(); });

  // ---------- State, kept here and reported to the server on every sync.
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('ambient') || '{}'); } catch (e) {}
  var state = {
    queue: saved.queue || [],
    index: typeof saved.index === 'number' ? saved.index : -1,
    notes: saved.notes || [],
    volume: typeof saved.volume === 'number' ? saved.volume : 70,
    playing: false, position: 0, duration: 0, error: null
  };
  function persist() {
    try { localStorage.setItem('ambient', JSON.stringify({ queue: state.queue, index: state.index, notes: state.notes, volume: state.volume, place: place && place.manual ? place : null })); } catch (e) {}
  }

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  var toastTimer;
  function toast(text) {
    $('toast').textContent = text; $('toast').classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $('toast').classList.remove('on'); }, 2600);
  }
  var NATIVE = window.AmbientNative || null;
  if (NATIVE) document.documentElement.classList.add('native');

  // ---------- Clock, with a slow drift so nothing burns in.
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function tick() {
    var d = new Date(), h = d.getHours(), h12 = h % 12 || 12;
    var txt = h12 + ':' + ('0' + d.getMinutes()).slice(-2) + '<span class="ap">' + (h < 12 ? 'AM' : 'PM') + '</span>';
    if (txt !== clockTxt) { clockTxt = txt; $('clock').innerHTML = txt; fitClock(); }
    var greet = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : h < 22 ? 'Good evening' : 'Good night';
    $('date').textContent = greet + ' · ' + DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  // The time always spans the bar under it (495px), however many digits it has; never taller than the card allows.
  var clockTxt = '';
  function fitClock() {
    var c = $('clock'); c.style.fontSize = '184px';
    c.style.fontSize = Math.min(248, 184 * 495 / c.scrollWidth).toFixed(1) + 'px';
  }
  tick(); setInterval(tick, 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitClock);
  var driftStep = 0;
  setInterval(function () {
    driftStep++;
    $('drift').style.transform = 'translate(' + (Math.sin(driftStep * 0.7) * 10).toFixed(1) + 'px,' + (Math.cos(driftStep * 0.5) * 8).toFixed(1) + 'px)';
    setTimeout(function () { placeDeck(); placeBlob(); }, 2100);
  }, 60000);

  // ---------- Droplets on the weather glass: a few beads hugging the rim, like the design.
  (function () {
    var g = '', seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 26; i++) {
      var side = i % 4, f = 0.12 + rnd() * 0.76, x, y, r = 2 + rnd() * (i % 5 === 0 ? 9 : 4);
      if (side === 0) { x = 24 + rnd() * 10; y = 509 * f; } else if (side === 1) { x = 454 - 24 - rnd() * 10; y = 509 * f; }
      else if (side === 2) { x = 454 * f; y = 22 + rnd() * 10; } else { x = 454 * f; y = 509 - 22 - rnd() * 10; }
      g += '<g transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ')"><ellipse rx="' + r.toFixed(1) + '" ry="' + (r * 1.12).toFixed(1) +
        '" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.45)" stroke-width="1"/><ellipse cx="' + (-r * .35).toFixed(1) + '" cy="' + (-r * .4).toFixed(1) +
        '" rx="' + (r * .32).toFixed(1) + '" ry="' + (r * .22).toFixed(1) + '" fill="rgba(255,255,255,.85)"/><path d="M' + (-r * .7).toFixed(1) + ' ' + (r * .5).toFixed(1) +
        ' Q0 ' + (r * 1.1).toFixed(1) + ' ' + (r * .7).toFixed(1) + ' ' + (r * .5).toFixed(1) + '" stroke="rgba(0,0,0,.25)" stroke-width="1" fill="none"/></g>';
    }
    $('dropsG').innerHTML = g;
  })();

  // ---------- Weather icons: glossy, layered SVG (sun, moon, cloud, rain, snow, storm, fog).
  var DEFS = '<defs><radialGradient id="gSun" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#fff2a8"/><stop offset=".55" stop-color="#ffcf2e"/><stop offset="1" stop-color="#f29a12"/></radialGradient>' +
    '<radialGradient id="gMoon" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#e3e6ff"/><stop offset="1" stop-color="#aab3ee"/></radialGradient>' +
    '<linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e4eef9"/><stop offset="1" stop-color="#b7cbe2"/></linearGradient>' +
    '<linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6dde6"/><stop offset="1" stop-color="#8e9aab"/></linearGradient></defs>';
  function cloud(x, y, s, fill) {
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')"><path d="M30 92 h118 a30 30 0 0 0 2-60 a42 42 0 0 0-80-8 a32 32 0 0 0-40 26 a22 22 0 0 0 0 42z" fill="rgba(0,0,0,.15)" transform="translate(0,6)"/>' +
      '<path d="M30 92 h118 a30 30 0 0 0 2-60 a42 42 0 0 0-80-8 a32 32 0 0 0-40 26 a22 22 0 0 0 0 42z" fill="url(#' + (fill || 'gCloud') + ')"/>' +
      '<path d="M44 46 a32 32 0 0 1 30-18" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/></g>';
  }
  function sun(x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="url(#gSun)"/><ellipse cx="' + (x - r * .3) + '" cy="' + (y - r * .4) + '" rx="' + r * .35 + '" ry="' + r * .2 + '" fill="#fff" opacity=".5"/>'; }
  function moon(x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="url(#gMoon)"/><circle cx="' + (x + r * .3) + '" cy="' + (y - r * .2) + '" r="' + r * .18 + '" fill="#b9c0ee" opacity=".7"/><circle cx="' + (x - r * .35) + '" cy="' + (y + r * .35) + '" r="' + r * .12 + '" fill="#b9c0ee" opacity=".6"/>'; }
  function drops(kind) {
    var s = '';
    for (var i = 0; i < 4; i++) {
      var x = 62 + i * 26, y = 118 + (i % 2) * 10;
      s += kind === 'snow' ? '<circle cx="' + x + '" cy="' + (y + 6) + '" r="5" fill="#fff"/>' : '<path d="M' + x + ' ' + y + ' l-6 16" stroke="#7cc4ff" stroke-width="6" stroke-linecap="round"/>';
    }
    return s;
  }
  function wIconSvg(code, isDay) {
    var orb = isDay ? sun : moon, s = DEFS;
    if (code <= 1) return s + orb(105, 75, code === 0 ? 52 : 46) + (code === 1 ? cloud(70, 58, .55) : '');
    if (code === 2) return s + orb(130, 52, 40) + cloud(20, 38, .85);
    if (code === 3) return s + cloud(52, 6, .62, 'gDark') + cloud(16, 34, .85);
    if (code === 45 || code === 48) return s + cloud(20, 10, .85) + '<g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85"><path d="M40 118h120M60 136h100"/></g>';
    if (code >= 95) return s + cloud(20, 6, .85, 'gDark') + '<path d="M100 94 l-16 26 h16 l-10 24 l28-34 h-16 l10-16z" fill="#ffd23a"/>';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return s + cloud(20, 4, .85) + drops('snow');
    if (code >= 51) return s + (code === 80 || code === 51 || code === 61 ? orb(140, 40, 30) : '') + cloud(20, 4, .85) + drops('rain');
    return s + cloud(20, 20, .85);
  }
  function smallIcon(code, isDay) { return '<svg viewBox="0 0 210 150">' + wIconSvg(code, isDay).replace(/id="g/g, 'id="h' + code + (isDay ? 'd' : 'n')).replace(/url\(#g/g, 'url(#h' + code + (isDay ? 'd' : 'n')) + '</svg>'; }

  // ---------- Weather, air quality and sun from Open-Meteo.
  // Location: the one set from the phone, else the connection's public IP (two services, in turn).
  var WMO = {
    0: 'Clear sky', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Freezing fog', 51: 'Light drizzle', 53: 'Drizzle',
    55: 'Heavy drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain',
    67: 'Freezing rain', 71: 'Light snow', 73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains', 80: 'Light showers', 81: 'Showers',
    82: 'Heavy showers', 85: 'Snow showers', 86: 'Heavy snow showers', 95: 'Thunderstorm', 96: 'Thunderstorm, hail', 99: 'Thunderstorm, hail'
  };
  function hhmm(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }

  var place = saved.place || null;          // {name, lat, lon, country, manual}
  function ipLocate() {
    var tries = [
      function () { return fetch('https://ipwho.is/').then(function (r) { return r.json(); }).then(function (j) {
        if (!j.success) throw 0; return { name: j.city, lat: j.latitude, lon: j.longitude, country: j.country_code }; }); },
      function () { return fetch('https://get.geojs.io/v1/ip/geo.json').then(function (r) { return r.json(); }).then(function (j) {
        if (!j.latitude) throw 0; return { name: j.city, lat: +j.latitude, lon: +j.longitude, country: j.country_code }; }); }
    ];
    var k = 0;
    function next() { return k < tries.length ? tries[k++]().catch(next) : Promise.reject(); }
    return next();
  }
  function ensurePlace() {
    if (place && place.manual) return Promise.resolve(place);
    return ipLocate().then(function (p) { place = p; return p; }, function () { return place; });
  }

  var wxReport = null;
  function weather() {
    ensurePlace().then(function (p) {
      if (!p) { $('wCity').textContent = 'Set your location on the phone'; $('wxCard').classList.add('on'); return; }
      $('wCity').textContent = p.name || 'Your location';
      var mph = p.country === 'GB' || p.country === 'US';
      var q = 'latitude=' + p.lat + '&longitude=' + p.lon + '&timezone=auto';
      var wx = fetch('https://api.open-meteo.com/v1/forecast?' + q + '&wind_speed_unit=' + (mph ? 'mph' : 'kmh') +
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,uv_index' +
        '&hourly=temperature_2m,weather_code,is_day,precipitation_probability' +
        '&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,weather_code&forecast_days=3&past_days=1')
        .then(function (r) { return r.json(); });
      var air = fetch('https://air-quality-api.open-meteo.com/v1/air-quality?' + q + '&current=european_aqi,us_aqi,pm2_5,pm10')
        .then(function (r) { return r.json(); }).catch(function () { return null; });
      return Promise.all([wx, air]).then(function (res) { render(res[0], res[1], mph ? 'mph' : 'km/h'); });
    }).catch(function () { $('wDesc').textContent = 'Weather unavailable'; $('wxCard').classList.add('on'); });
  }

  var DROP = '<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8"><path d="M10 2.5C7 7 5 9.6 5 12.4a5 5 0 0 0 10 0C15 9.6 13 7 10 2.5z"/></svg>';
  var WIND = '<svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M2 7h10a2.5 2.5 0 1 0-2.5-2.5M2 11h14a2.5 2.5 0 1 1-2.5 2.5M2 15h7"/></svg>';
  function render(w, a, windUnit) {
    var c = w.current, d = w.daily;
    wxReport = { temp: Math.round(c.temperature_2m), desc: WMO[c.weather_code] || '', hi: Math.round(d.temperature_2m_max[1]),
      lo: Math.round(d.temperature_2m_min[1]), city: place && place.name, sunrise: hhmm(new Date(d.sunrise[1])), sunset: hhmm(new Date(d.sunset[1])) };
    if (d.precipitation_probability_max) wxReport.rain = d.precipitation_probability_max[1];
    if (d.time && d.time.length > 2) wxReport.tomorrow = { desc: WMO[d.weather_code[2]] || '', hi: Math.round(d.temperature_2m_max[2]),
      lo: Math.round(d.temperature_2m_min[2]), rain: d.precipitation_probability_max ? d.precipitation_probability_max[2] : null };
    $('wIcon').innerHTML = wIconSvg(c.weather_code, c.is_day);
    $('wTemp').textContent = Math.round(c.temperature_2m) + '°';
    $('wDesc').textContent = WMO[c.weather_code] || '—';
    var rain = d.precipitation_probability_max ? d.precipitation_probability_max[1] : null;
    $('wSub').textContent = 'Feels ' + Math.round(c.apparent_temperature) + '°  ·  H ' + Math.round(d.temperature_2m_max[1]) +
      '°  L ' + Math.round(d.temperature_2m_min[1]) + '°';

    $('wRow').innerHTML = '<span>' + DROP + Math.round(c.relative_humidity_2m) + '% humidity</span>';

    // The tile: air quality (European AQI, the scale used across the UK and EU), wind and rain.
    if (a && a.current && a.current.european_aqi != null) {
      var aqi = Math.round(a.current.european_aqi);
      var bands = [[20, 'Good', '#7af5ec'], [40, 'Fair', '#7ae0c0'], [60, 'Moderate', '#f5ec6a'], [80, 'Poor', '#ffa070'],
        [100, 'Very poor', '#ff7070'], [1e9, 'Extremely poor', '#ff5a9a']];
      var b = bands.filter(function (x) { return aqi <= x[0]; })[0];
      wxReport.aqi = aqi; wxReport.aqiBand = b[1];
      $('aqiCol').style.setProperty('--aqi', b[2]);
      $('aqiNum').textContent = aqi; $('aqiBand').textContent = b[1];
      $('aqiM').style.left = Math.max(3, Math.min(97, aqi / 1.2)) + '%';
    } else {
      $('aqiNum').textContent = '–'; $('aqiBand').textContent = 'No data';
    }
    // The arrow points where the wind is going (the reading says where it comes from).
    $('windArrow').style.transform = 'rotate(' + Math.round((c.wind_direction_10m + 180) % 360) + 'deg)';
    $('windV').textContent = Math.round(c.wind_speed_10m); $('windU').textContent = windUnit;
    $('windG').textContent = 'Gusts ' + Math.round(c.wind_gusts_10m) + ' ' + windUnit;
    var soon = 0, now0 = Date.now();
    for (var hh = 0; hh < w.hourly.time.length; hh++) {
      var at = new Date(w.hourly.time[hh]).getTime();
      if (at > now0 - 30 * 60000 && at < now0 + 3 * 3600000 && w.hourly.precipitation_probability) soon = Math.max(soon, w.hourly.precipitation_probability[hh]);
    }
    $('rainV').textContent = rain != null ? rain + '%' : '–';
    $('rainS').textContent = 'Next 3h: ' + soon + '%';
    $('wTile').classList.add('on');

    // Sun: yesterday's, today's and tomorrow's sunrises and sunsets, so any moment falls in a day or a night.
    sky.rises = d.sunrise.map(function (t) { return new Date(t).getTime(); });
    sky.sets = d.sunset.map(function (t) { return new Date(t).getTime(); });
    drawSky();

    var html = '', shown = 0, t0 = Date.now();
    for (var h = 0; h < w.hourly.time.length && shown < 6; h++) {
      var t = new Date(w.hourly.time[h]);
      if (t.getTime() < t0 - 30 * 60000) continue;
      var pp = w.hourly.precipitation_probability ? w.hourly.precipitation_probability[h] : 0;
      html += '<div class="hr">' + (shown === 0 ? 'Now' : ('0' + t.getHours()).slice(-2)) + smallIcon(w.hourly.weather_code[h], w.hourly.is_day[h]) +
        '<span>' + Math.round(w.hourly.temperature_2m[h]) + '°</span><em>' + (pp >= 20 ? pp + '%' : '') + '</em></div>';
      shown++;
    }
    $('wHours').innerHTML = html;
    $('wHours').classList.add('on');
    $('wxCard').classList.add('on');
  }

  // ---------- Sunrise and sunset: the dial fills as the day (or night) goes by.
  var sky = { rises: null, sets: null };
  function dur(ms) { var m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + ('0' + m % 60).slice(-2) + 'm'; }
  function phaseAt(now) {
    var R = sky.rises, S = sky.sets;
    for (var i = 0; i < R.length; i++) {
      if (now >= R[i] && now < S[i]) return { day: true, start: R[i], end: S[i] };
      if (now >= S[i] && i + 1 < R.length && now < R[i + 1]) return { day: false, start: S[i], end: R[i + 1] };
    }
    return null;
  }
  function drawSky() {
    if (!sky.rises) return;
    var now = Date.now(), ph = phaseAt(now);
    if (!ph) return;
    var f = Math.max(0, Math.min(1, (now - ph.start) / (ph.end - ph.start)));
    $('dialArc').setAttribute('stroke-dasharray', (f * 100).toFixed(2) + ' 100');
    var th = -Math.PI / 2 + f * Math.PI * 2;
    $('dialDot').setAttribute('cx', (88 + 58 * Math.cos(th)).toFixed(1));
    $('dialDot').setAttribute('cy', (88 + 58 * Math.sin(th)).toFixed(1));
    $('sunPill').classList.toggle('night', !ph.day);
    $('sunrise').textContent = hhmm(new Date(ph.start));
    $('sunset').textContent = hhmm(new Date(ph.end));
    $('untilNext').textContent = dur(ph.end - now);
    $('untilName').textContent = ph.day ? 'to sunset' : 'to sunrise';
  }
  setInterval(drawSky, 30 * 1000);
  weather(); setInterval(weather, 15 * 60 * 1000);

  // ---------- Phone link.
  try { new QRCode($('qr'), { text: phoneUrl, width: 256, height: 256, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}

  // ---------- Notes.
  var NOTE_COLORS = { sun: '#ffd76a', rose: '#ff7a9a', sky: '#7cc4ff', mint: '#6fe3b5', lilac: '#b79bff' };
  var ringId = null;
  function renderNotes(newId) {
    var list = state.notes.slice().reverse(), shown = list.slice(0, 3);
    $('notes').innerHTML = shown.map(function (n) {
      var t = new Date(n.time);
      var pending = n.at && !n.fired;
      var meta = pending ? '<span class="due">⏰ ' + (new Date(n.at).toDateString() === new Date().toDateString() ? '' : 'Tomorrow ') + hhmm(new Date(n.at)) + '</span>'
        : n.at ? '⏰ ' + hhmm(new Date(n.at)) : hhmm(t);
      return '<div class="note glass' + (n.id === newId ? ' new' : '') + (n.id === ringId ? ' ring' : '') + '" style="--c:' + (NOTE_COLORS[n.color] || NOTE_COLORS.sun) + '">' +
        esc(n.text) + '<small>' + meta + '</small></div>';
    }).join('');
    // Only whole notes that fit between Jarvis and the QR code; the rest are counted.
    var box = $('notes'), cards = box.querySelectorAll('.note'), kept = cards.length;
    while (kept > 1 && box.scrollHeight > 350) { box.removeChild(cards[--kept]); }
    if (list.length > kept) box.insertAdjacentHTML('beforeend', '<div class="more">+' + (list.length - kept) + ' more on your phone</div>');
  }

  // Reminders: a note with a time; when it comes, it rings on screen with a soft chime.
  function chime() {
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      [[880, 0], [1320, .18], [1760, .36]].forEach(function (n) {
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0, ac.currentTime + n[1]);
        g.gain.linearRampToValueAtTime(.22, ac.currentTime + n[1] + .02);
        g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + n[1] + 1.2);
        o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + n[1]); o.stop(ac.currentTime + n[1] + 1.3);
      });
      setTimeout(function () { ac.close(); }, 2500);
    } catch (e) {}
  }
  function checkReminders() {
    var now = Date.now(), due = null;
    state.notes.forEach(function (n) { if (n.at && !n.fired && n.at <= now) { n.fired = true; n.color = 'rose'; due = n; } });
    if (!due) return;
    state.notes = state.notes.filter(function (n) { return n !== due; }).concat([due]);
    persist(); ringId = due.id; renderNotes(due.id); ringId = null;
    if (playerReady && state.playing) { player.setVolume(Math.round(state.volume * 0.3)); setTimeout(function () { player.setVolume(state.volume); }, 6000); }
    chime(); setTimeout(chime, 2200);
    toast('⏰ ' + due.text);
  }
  setInterval(checkReminders, 5000);

  // ---------- Jarvis: the liquid blob. On the TV it is drawn natively (BlobView) at full frame rate; in a
  // browser, by WebGL here. Either way the page only says what it is doing and how loud the voice is.
  var NATIVE_BLOB = !!(NATIVE && NATIVE.blobRect);
  if (NATIVE_BLOB) $('blob').style.visibility = 'hidden';
  else JarvisBlob.mount($('blob'), 'blob.webp');
  var lastBlob = '';
  function placeBlob() {
    if (!NATIVE_BLOB) return;
    var r = $('blobBox').getBoundingClientRect(), key = [r.left, r.top, r.width].map(Math.round).join(',');
    if (key !== lastBlob) { lastBlob = key; NATIVE.blobRect(r.left, r.top, r.width); }
  }
  placeBlob();
  function blobMode(m) {
    document.body.classList.toggle('jarvis-listening', m === 'listening');
    document.body.classList.toggle('jarvis-speaking', m === 'speaking');
    if (NATIVE_BLOB) NATIVE.blobMode(m); else JarvisBlob.mode(m);
  }
  function blobLevel(v) { if (NATIVE_BLOB) NATIVE.blobLevel(v); else JarvisBlob.level(v); }

  var voiceReport = null;
  var talk = { state: 'idle', timer: null, fallback: null };
  function bubble(heard, html) {
    $('bbHeard').textContent = heard ? '“' + heard + '”' : '';
    $('bbReply').innerHTML = html;
    $('botBubble').classList.add('on');
  }
  function setTalk(st) {
    talk.state = st;
    blobMode(st === 'speaking' && !talk.started ? 'thinking' : st);
    if (st === 'idle') {
      $('botBubble').classList.remove('on');
      blobLevel(0);
      if (playerReady && talk.ducked) { player.setVolume(state.volume); talk.ducked = false; }
    }
  }
  window.jarvisListening = function (on) {
    if (!on || talk.state === 'speaking') return;
    clearTimeout(talk.timer);
    setTalk('listening');
    bubble('', 'Listening <span class="dots"><i></i><i></i><i></i></span>');
    talk.timer = setTimeout(function () { if (talk.state === 'listening') setTalk('idle'); }, 12000);
  };
  var lastSaid = { text: '', at: 0 };
  function jarvisSays(heard, reply) {
    if (reply === lastSaid.text && Date.now() - lastSaid.at < 4000) return;
    lastSaid = { text: reply, at: Date.now() };
    clearTimeout(talk.timer); clearInterval(talk.fallback);
    // Words wait, hidden, until the voice reaches them; the blob swirls until the voice starts.
    talk.words = reply.split(/(\s+)/);
    talk.reply = reply; talk.shown = 0; talk.started = false;
    setTalk('speaking');
    bubble(heard, '<span class="dots"><i></i><i></i><i></i></span>');
    if (playerReady && state.playing && !talk.ducked) { player.setVolume(Math.round(state.volume * 0.25)); talk.ducked = true; }
    var spoke = false;
    try { spoke = NATIVE && NATIVE.speak(reply); } catch (e) {}
    if (!spoke) {
      // No voice at all: reveal and pulse at a speaking pace.
      var t0 = Date.now(), total = reply.length / 0.0145;
      setTimeout(function () {
        jarvisVoice('start');
        talk.fallback = setInterval(function () {
          var ms = Date.now() - t0 - 700;
          jarvisProgress(ms, total, ms % 600 < 420 ? 0.4 + Math.random() * 0.5 : 0.05, Math.random());
          if (ms > total) { clearInterval(talk.fallback); jarvisVoice('done'); }
        }, 50);
      }, 700);
    }
    talk.timer = setTimeout(function () { if (talk.state === 'speaking') jarvisVoice('done'); }, 12000 + reply.length * 90);
  }

  function revealWords(chars) {
    if (!talk.words) return;
    var html = '', used = 0;
    talk.words.forEach(function (w) {
      if (/^\s+$/.test(w)) { html += w; return; }
      used += w.length + 1;
      html += '<span class="w' + (used <= chars + 2 ? ' on' : '') + '">' + esc(w) + '</span>';
    });
    $('bbReply').innerHTML = html;
  }

  // From the TV, 20 times a second while it speaks: ms played, total ms (-1 while still streaming),
  // loudness now, and brightness of the sound.
  window.jarvisProgress = function (ms, total, level) {
    if (talk.state !== 'speaking') return;
    if (!talk.started) jarvisVoice('start');
    var perMs = total > 0 ? talk.reply.length / total : 0.0145;
    var chars = Math.floor((ms + 250) * perMs);
    if (chars !== talk.shown) { talk.shown = chars; revealWords(chars); }
    blobLevel(level < 0.06 ? 0 : Math.min(1, Math.pow(level, 0.7)));
  };
  window.jarvisMouth = function (level) {
    if (talk.state !== 'speaking') return;
    blobLevel(level < 0.06 ? 0 : Math.min(1, Math.pow(level, 0.7)));
  };
  window.jarvisVoice = function (ev) {
    if (ev === 'flap') {   // no loudness on this TV: pulse in a speaking rhythm
      clearInterval(talk.fallback);
      var n = 0;
      talk.fallback = setInterval(function () { blobLevel(n++ % 4 === 3 ? 0 : 0.3 + Math.random() * 0.6); }, 150);
    } else if (ev === 'start') {
      if (talk.started) return;
      talk.started = true;
      blobMode('speaking');
      revealWords(0);
      clearTimeout(talk.timer);
      talk.timer = setTimeout(function () { jarvisVoice('done'); }, 60000);
    } else if (ev === 'done' && talk.state === 'speaking') {
      clearInterval(talk.fallback); blobLevel(0); clearTimeout(talk.timer);
      if (talk.words) revealWords(1e9);
      talk.timer = setTimeout(function () { setTalk('idle'); }, 2500);   // let the answer sit a moment
    }
  };

  // ---------- YouTube player.
  var player = null, playerReady = false, pendingLoad = null;
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('yt', {
      width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1, iv_load_policy: 3, origin: location.origin },
      events: {
        onReady: function () {
          playerReady = true;
          player.setVolume(state.volume);
          if (pendingLoad) { var p = pendingLoad; pendingLoad = null; load(p); }
        },
        onStateChange: function (e) {
          state.playing = e.data === YT.PlayerState.PLAYING;
          document.body.classList.toggle('paused', !state.playing);
          // Buffering between songs keeps the needle down; a real pause or the end lifts it.
          if (e.data !== YT.PlayerState.BUFFERING) deckState(state.playing, state.duration ? state.position / state.duration : 0);
          if (e.data === YT.PlayerState.ENDED) next();
        },
        onError: function (e) {
          var item = state.queue[state.index];
          state.error = 'Can’t play ' + (item ? '“' + item.title + '”' : 'this video') + ' here (YouTube error ' + e.data + ')';
          toast(state.error + ' — skipping');
          setTimeout(next, 1500);
        }
      }
    });
  };
  var api = document.createElement('script');
  api.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(api);

  var loadedId = null;
  function load(item) {
    if (!playerReady) { pendingLoad = item; return; }
    state.error = null;
    loadedId = item.id;
    player.loadVideoById(item.id);
    player.setVolume(state.volume);
  }

  function show() {
    var item = state.queue[state.index];
    var on = !!item;
    $('meta').classList.toggle('on', on);
    if (on) {
      $('title').textContent = item.title;
      $('artist').textContent = item.artist || '';
      setArt(item);
      $('glow').classList.add('on');
      var upcoming = state.queue.slice(state.index + 1, state.index + 2);
      $('next').innerHTML = upcoming.length ? 'Up next  <span>' + esc(upcoming[0].title) + '</span>' : '';
    } else {
      $('glow').classList.remove('on');
    }
  }

  // Cover art: drawn once per song onto the record's label and, tiny, onto the glow canvas.
  var artFor = null;
  function setArt(item) {
    if (artFor === item.id) return;
    artFor = item.id;
    var tries = ['maxresdefault', 'sddefault', 'hqdefault'].map(function (n) { return 'https://i.ytimg.com/vi/' + item.id + '/' + n + '.jpg'; });
    (function attempt(k) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        if (img.naturalWidth <= 120 && k + 1 < tries.length) { attempt(k + 1); return; }
        if (artFor !== item.id) return;
        drawDisc(img); drawGlow(img);
      };
      img.onerror = function () { if (k + 1 < tries.length) attempt(k + 1); };
      img.src = tries[k];
    })(0);
  }
  function source(img) {
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (Math.abs(iw / ih - 4 / 3) < 0.02) return [0, ih * 0.125, iw, ih * 0.75];
    return [0, 0, iw, ih];
  }
  function drawCover(g, img, w, h) {
    var src = source(img), scale = Math.max(w / src[2], h / src[3]);
    var dw = src[2] * scale, dh = src[3] * scale;
    g.drawImage(img, src[0], src[1], src[2], src[3], (w - dw) / 2, (h - dh) / 2, dw, dh);
  }
  // The record: grooves pressed in black vinyl, and the song's cover art on the label (a plain label without one).
  function drawDisc(img) {
    if (NATIVE) { if (img) NATIVE.discArt(img.src); return; }
    var c = $('disc'), size = c.width, r = size / 2, g = c.getContext('2d');
    g.clearRect(0, 0, size, size);
    g.save(); g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.clip();
    var v = g.createRadialGradient(r, r, r * .3, r, r, r); v.addColorStop(0, '#1b1b1d'); v.addColorStop(1, '#0b0b0c');
    g.fillStyle = v; g.fillRect(0, 0, size, size);
    for (var rr = r * .4; rr < r * .985; rr += 2.2) {
      var gap = [.55, .68, .8, .9].some(function (k) { return Math.abs(rr / r - k) < .006; });
      g.strokeStyle = gap ? 'rgba(0,0,0,.9)' : 'rgba(255,255,255,' + (.025 + .03 * Math.random()).toFixed(3) + ')';
      g.lineWidth = gap ? 3 : 1; g.beginPath(); g.arc(r, r, rr, 0, Math.PI * 2); g.stroke();
    }
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2; g.beginPath(); g.arc(r, r, r - 2, 0, Math.PI * 2); g.stroke();
    // label
    var L = r * .36;
    g.save(); g.beginPath(); g.arc(r, r, L, 0, Math.PI * 2); g.clip();
    if (img) {
      var s = L * 2; g.translate(r - L, r - L); drawCover(g, img, s, s);
    } else {
      g.fillStyle = '#7d1f2b'; g.fillRect(0, 0, size, size);
      g.fillStyle = 'rgba(255,255,255,.8)'; g.font = '600 ' + Math.round(L * .2) + 'px Outfit, sans-serif'; g.textAlign = 'center';
      g.fillText('AMBIENT', r, r - L * .35); g.font = Math.round(L * .13) + 'px Outfit, sans-serif'; g.fillText('33⅓ RPM', r, r + L * .55);
    }
    g.restore();
    g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 3; g.beginPath(); g.arc(r, r, L, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
  drawDisc(null);

  // ---------- The turntable: play lowers the arm onto the record as it spins up; pause lets the record run
  // down and puts the arm back. The arm creeps inwards over the song, like a real stylus.
  var REST = -18, START = 0, END = 9, RPS = 33.333 / 60;
  var deck = { playing: false, angle: 0, speed: 0, last: 0, running: false, armAt: REST, liftTimer: null };
  function armTo(deg) {
    if (Math.abs(deg - deck.armAt) < 0.05) return;
    var travel = Math.abs(deg - deck.armAt) > 3;
    deck.armAt = deg;
    if (travel) {   // a real move: lift, swing, set down
      $('arm').classList.add('lift');
      clearTimeout(deck.liftTimer);
      deck.liftTimer = setTimeout(function () { $('arm').classList.remove('lift'); }, 1150);
    }
    $('arm').style.transform = 'rotate(' + deg.toFixed(2) + 'deg)';
  }
  function spinLoop(t) {
    var dt = deck.last ? Math.min(0.05, (t - deck.last) / 1000) : 0; deck.last = t;
    var target = deck.playing ? RPS : 0;
    // about 0.8 s to come up to speed, about 1.6 s to run down
    deck.speed += Math.max(-RPS * dt / 1.6, Math.min(RPS * dt / 0.8, target - deck.speed));
    deck.angle = (deck.angle + deck.speed * 360 * dt) % 360;
    $('disc').style.transform = 'rotate(' + deck.angle.toFixed(2) + 'deg)';
    if (deck.playing || deck.speed > 0.0005) requestAnimationFrame(spinLoop); else { deck.running = false; deck.last = 0; }
  }
  function deckState(playing, progress) {
    if (NATIVE) { NATIVE.deckState(playing, Math.max(0, Math.min(1, progress || 0))); return; }
    deck.playing = playing;
    armTo(playing ? START + (END - START) * Math.max(0, Math.min(1, progress || 0)) : REST);
    if (playing && !deck.running) { deck.running = true; requestAnimationFrame(spinLoop); }
  }
  function drawGlow(img) {
    var c = $('glow'), g = c.getContext('2d');
    g.save(); g.clearRect(0, 0, 32, 18);
    g.filter = 'saturate(1.6) brightness(.55)';
    drawCover(g, img, 32, 18);
    g.restore();
  }
  // On the TV the whole turntable (deck, record and arm) is drawn natively at full frame rate over #deck.
  var lastRect = '';
  function placeDeck() {
    if (!NATIVE) return;
    var r = $('deck').getBoundingClientRect(), key = [r.left, r.top, r.width, r.height].map(Math.round).join(',');
    if (key !== lastRect) { lastRect = key; NATIVE.deckRect(r.left, r.top, r.width, r.height); }
  }

  function playAt(i) {
    if (i < 0 || i >= state.queue.length) return;
    state.index = i; persist(); show(); load(state.queue[i]);
  }
  function next() {
    if (state.index + 1 < state.queue.length) playAt(state.index + 1);
    else { state.playing = false; if (player && playerReady) player.stopVideo(); }
  }
  function prev() {
    if (playerReady && player.getCurrentTime() > 4) { player.seekTo(0, true); return; }
    if (state.index > 0) playAt(state.index - 1);
  }
  function toggle() {
    if (!playerReady || state.index < 0) return;
    if (loadedId !== state.queue[state.index].id) { load(state.queue[state.index]); return; }
    if (state.playing) player.pauseVideo(); else player.playVideo();
  }
  function setVolume(v) {
    state.volume = Math.max(0, Math.min(100, Math.round(v))); persist();
    if (playerReady) player.setVolume(state.volume);
    toast('Volume ' + state.volume);
  }

  // ---------- Commands from phones.
  function apply(c) {
    switch (c.type) {
      case 'play':
        state.queue.splice(state.index + 1, 0, c.item);
        playAt(state.index + 1);
        toast('▶ ' + c.item.title);
        break;
      case 'enqueue':
        state.queue.push(c.item); persist();
        if (state.index < 0 || (!state.playing && state.index === state.queue.length - 2 && playerReady && player.getPlayerState() === YT.PlayerState.ENDED)) playAt(state.queue.length - 1);
        else { show(); toast('Queued: ' + c.item.title); }
        break;
      case 'pause': if (playerReady && state.playing) player.pauseVideo(); break;
      case 'resume':
        if (state.index >= 0) { if (loadedId !== state.queue[state.index].id) load(state.queue[state.index]); else if (playerReady) player.playVideo(); }
        break;
      case 'reminder':
        var rem = { id: Date.now(), text: String(c.text || 'Reminder').slice(0, 240), color: 'sky', time: Date.now(), at: +c.at };
        state.notes.push(rem); state.notes = state.notes.slice(-20); persist(); renderNotes(rem.id);
        break;
      case 'jarvis': jarvisSays(c.heard, c.reply); break;
      case 'voiceInfo': try { voiceReport = NATIVE ? NATIVE.voiceInfo() : 'no native'; } catch (e) { voiceReport = String(e); } break;
      case 'note':
        var note = { id: Date.now(), text: String(c.text || '').slice(0, 240), color: c.color || 'sun', time: Date.now() };
        if (!note.text.trim()) break;
        state.notes.push(note); state.notes = state.notes.slice(-20); persist(); renderNotes(note.id);
        break;
      case 'editNote':   // Jarvis changed a note's words; a reminder keeps its time
        var ed = state.notes.filter(function (n) { return n.id === c.id; })[0];
        var nt = String(c.text || '').slice(0, 240);
        if (ed && nt.trim()) { ed.text = nt; persist(); renderNotes(ed.id); }
        break;
      case 'deleteNote':
        state.notes = state.notes.filter(function (n) { return n.id !== c.id; }); persist(); renderNotes();
        break;
      case 'clearNotes':
        state.notes = []; persist(); renderNotes();
        break;
      case 'move':   // reorder Up next; the playing song and earlier ones stay put
        var from = c.from, to = c.to;
        if (from > state.index && to > state.index && from < state.queue.length && to < state.queue.length && from !== to) {
          state.queue.splice(to, 0, state.queue.splice(from, 1)[0]); persist(); show();
        }
        break;
      case 'jump': playAt(c.index); break;
      case 'remove':
        if (c.index > state.index) { state.queue.splice(c.index, 1); persist(); show(); }
        break;
      case 'clearQueue':
        state.queue = state.index >= 0 ? [state.queue[state.index]] : []; state.index = state.queue.length ? 0 : -1; persist(); show();
        break;
      case 'toggle': toggle(); break;
      case 'next': next(); break;
      case 'prev': prev(); break;
      case 'stop':
        if (playerReady) player.stopVideo();
        state.index = -1; state.queue = []; state.playing = false; persist(); show();
        break;
      case 'location':
        if (c.place && typeof c.place.lat === 'number') {
          place = { name: c.place.name, lat: c.place.lat, lon: c.place.lon, country: c.place.country, manual: true };
        } else {
          place = null;   // back to automatic
        }
        persist(); $('wCity').textContent = 'Locating…'; weather(); toast('Location: ' + (place ? place.name : 'automatic'));
        break;
      case 'seek': if (playerReady) player.seekTo(c.value, true); break;
      case 'volume': setVolume(c.value); break;
    }
  }
  if (!NATIVE) { window.ambientApply = apply; window.ambientDeck = deckState; }   // the browser preview drives the screen with these

  // ---------- Remote control on the TV.
  window.remoteKey = function (k) {
    if (k === 'playpause') toggle(); else if (k === 'next') next(); else if (k === 'prev') prev();
  };
  document.addEventListener('keydown', function (e) {
    switch (e.keyCode) {
      case 13: case 23: toggle(); break;          // OK
      case 39: next(); break;                      // Right
      case 37: prev(); break;                      // Left
      case 38: setVolume(state.volume + 10); break;     // Up: louder
      case 40: setVolume(state.volume - 10); break;     // Down: quieter
      default: return;
    }
    e.preventDefault();
  });

  // ---------- Sync with the server: report state, collect commands.
  function sync() {
    if (playerReady && player.getDuration) {
      state.position = player.getCurrentTime() || 0;
      state.duration = player.getDuration() || 0;
      $('barFill').style.transform = 'scaleX(' + (state.duration ? Math.min(1, state.position / state.duration) : 0).toFixed(4) + ')';
      if (state.playing) deckState(true, state.duration ? state.position / state.duration : 0);
      $('tPos').textContent = fmt(state.position);
      $('tDur').textContent = fmt(state.duration);
    }
    var report = {
      queue: state.queue, index: state.index, playing: state.playing, position: state.position,
      duration: state.duration, volume: state.volume, error: state.error, place: place, notes: state.notes, wx: wxReport, voice: voiceReport
    };
    fetch(API + '/api/tv/sync', { method: 'POST', body: JSON.stringify(report) })
      .then(function (r) { return r.json(); })
      .then(function (j) { (j.commands || []).forEach(apply); })
      .catch(function () {})
      .then(function () { setTimeout(sync, 600); });
  }
  if (API || NATIVE) sync();

  placeDeck(); deckState(false);
  renderNotes();
  // The last song comes back paused; OK or Play on the phone starts it.
  show();
})();
</script>
</body>
</html>
